name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            is_macos: true
            archive_name: led-${{ github.ref_name }}-macos-arm64
            gui_archive_name: led-gui-${{ github.ref_name }}-macos-arm64
          - name: macos-x64
            os: macos-13
            target: x86_64-apple-darwin
            is_macos: true
            archive_name: led-${{ github.ref_name }}-macos-x64
            gui_archive_name: led-gui-${{ github.ref_name }}-macos-x64
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            is_linux: true
            archive_name: led-${{ github.ref_name }}-linux-x64
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            is_windows: true
            archive_name: led-${{ github.ref_name }}-windows-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.is_linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libx11-xcb-dev \
            libvulkan-dev \
            libasound2-dev \
            libfontconfig1-dev \
            pkg-config

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # --- Unix Builds (macOS & Linux) ---
      - name: Build TUI (Unix)
        if: "!matrix.is_windows"
        run: |
          cargo build --release -p led-tui --target ${{ matrix.target }}
          mkdir -p dist/${{ matrix.archive_name }}
          cp target/${{ matrix.target }}/release/led-cli dist/${{ matrix.archive_name }}/
          cp target/${{ matrix.target }}/release/led-cli dist/${{ matrix.archive_name }}/led
          cp README.md MANUAL.md LICENSE* dist/${{ matrix.archive_name }}/ 2>/dev/null || true
          tar -czvf dist/${{ matrix.archive_name }}.tar.gz -C dist ${{ matrix.archive_name }}

      - name: Build & Package macOS GUI (.app)
        if: matrix.is_macos
        run: |
          make gui
          cd dist
          zip -r ${{ matrix.gui_archive_name }}.zip led.app

      # --- Windows Builds ---
      - name: Build Windows (GUI & CLI)
        if: matrix.is_windows
        shell: bash
        run: |
          cargo build --release -p led-gui --target ${{ matrix.target }}
          cargo build --release -p led-tui --target ${{ matrix.target }}
          mkdir -p dist/${{ matrix.archive_name }}
          cp target/${{ matrix.target }}/release/led.exe dist/${{ matrix.archive_name }}/
          cp target/${{ matrix.target }}/release/led-cli.exe dist/${{ matrix.archive_name }}/
          cp README.md MANUAL.md dist/${{ matrix.archive_name }}/ 2>/dev/null || true
          cd dist
          7z a ${{ matrix.archive_name }}.zip ${{ matrix.archive_name }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  publish-release:
    name: Publish Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release_assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
